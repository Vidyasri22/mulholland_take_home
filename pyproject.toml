[project]
name = "reznar-take-home"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
    "pgserver>=0.1",
    "pydantic>=2",
    "python-stdnum>=2.2",
    "us>=3.2.0",
    "py-moneyed>=3.0",
    "anthropic>=0.105.2",
    "pymupdf>=1.27.2.3",
    "google-genai>=2.7.0",
    "groq>=1.4.0",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
